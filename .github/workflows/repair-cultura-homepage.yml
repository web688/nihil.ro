name: Repair Cultura homepage images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-cultura-homepage.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix Cultura image layout and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<div class="sh-label">Cultură & Artă</div>'
          marker_pos = html.find(marker)
          if marker_pos < 0:
              raise SystemExit('Cultura section marker not found')
          section_open = '<section class="fapte-section">'
          section_pos = html.find(section_open, marker_pos)
          if section_pos < 0:
              raise SystemExit('Cultura card section not found')
          html = html[:section_pos] + '<section class="fapte-section cultura-home-section">' + html[section_pos + len(section_open):]
          image_paths = [
              'images/cultura/cultura-mona-lisa-hd-v3.jpg',
              'images/cultura/cultura-shakespeare-hd-v3.jpg',
              'images/cultura/cultura-tale-of-genji-hd-v4.jpg',
              'images/cultura/cultura-van-gogh-hd-v3.jpg',
          ]
          for image_path in image_paths:
              plain = f'src="{image_path}"'
              busted = f'src="{image_path}?v=7"'
              if plain in html:
                  html = html.replace(plain, busted, 1)
              elif busted not in html:
                  raise SystemExit(f'Image reference not found: {image_path}')
          css = "\n<style>\n/* Homepage Cultura & Arta: complete 16:9 images, no crop. */\n.cultura-home-section .fapt-img-wrap{width:100%;height:auto;aspect-ratio:16/9;overflow:hidden;background:var(--negru);}\n.cultura-home-section .fapt-img-wrap img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;}\n</style>\n"
          if 'cultura-home-section .fapt-img-wrap' not in html:
              html = html.replace('</head>', css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'cultura-home-section' index.html
          grep -q 'cultura-tale-of-genji-hd-v4.jpg?v=7' index.html

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NIHIL.ro Webmaster'
          git config user.email 'webmaster@nihil.ro'
          git rm .github/workflows/repair-cultura-homepage.yml
          git add index.html
          git commit -m 'Fix Cultura image quality and uncropped layout'
          git push origin HEAD:main
